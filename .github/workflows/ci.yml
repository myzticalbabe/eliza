name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest
          # eliza/psyche is GENERATED from PUBLIC_MANIFEST.json by tools/publicize.py, and the
          # manifest's sources live outside this repository (see .gitignore). Materialise where
          # that source tree is present; where it is not, skip the editable install instead of
          # failing on a package directory that cannot exist in a public checkout.
          if [ -f ../src/PSYCHE/__init__.py ]; then python tools/publicize.py; fi
          if [ -f pyproject.toml ] && [ -f eliza/psyche/rt_channel.py ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          if [ ! -f eliza/psyche/rt_channel.py ]; then echo "eliza/psyche is absent: the generated package cannot be installed here (run tools/publicize.py where the PSYCHE sources exist); the tests that need it skip with that reason."; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi
      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            pip install basedpyright && basedpyright --version
          fi

  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "job results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*)
              echo "a required job did not succeed"
              exit 1
              ;;
          esac
          echo "all required jobs succeeded"
