# CI Workflow for Eliza

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.14t"
            os: ubuntu-latest
          - python-version: "3.15t"
            os: ubuntu-latest
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q --tb=short -r f --timeout=120 2>/dev/null || true

      - name: Verify governance
        run: |
          python tools/verify_public_standards.py . || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff black mypy
      - name: Run ruff
        run: ruff check --select E4,E7,E9,F .
      - name: Run black --check
        run: black --check .
      - name: Run mypy
        shell: bash
        run: mypy --ignore-missing-imports . 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install pip-audit safety
      - name: Run pip-audit
        run: pip-audit || true
      - name: Run safety
        run: safety check || true

