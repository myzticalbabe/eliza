[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eliza"
version = "0.1.0"
description = "BCC Re-Investigation Machinery + Therapeutic Agent — public, fully executable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# No runtime dependencies, deliberately. The package is stdlib-only: a therapeutic
# loop that pulls in a numerical stack to map three numbers onto eight nodes has
# added an attack surface and a licence obligation for arithmetic. Ridge fitting
# and matrix inversion live in tools/, use Gauss-Jordan, and are not imports.
# BCC bypass uses curl_cffi, scrapling, playwright at runtime (optional).
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]
# Author identity is deliberately absent: this file is generated from a monorepo
# and the person publishing it has not recorded a name for public attribution.
# Fill `authors` in before a PyPI upload -- a placeholder name is worse than none.

[project.optional-dependencies]
dev = ["pytest>=7"]
bypass = ["curl_cffi>=0.8", "scrapling>=0.5", "playwright>=1.40"]

[project.scripts]
# The live channel: newline-delimited JSON over stdio. Present as a console
# script because the tutorial's first executable step should not be a file path.
eliza-psyche = "eliza.psyche.rt_channel:main"
# BCC Re-Investigation Machinery
bcc-bypass = "tools.bcc_bypass:cli_main"
ultra-loose = "tools.ultra_loose:main"

[project.urls]
# No repository URL: this tree is materialised from a larger private monorepo and
# the public repository does not exist yet. A guessed URL is a broken link.

[tool.setuptools]
# `shards/` is a tracked sibling of `eliza/`: the latter is GENERATED by
# tools/publicize.py and `--clean` deletes it, so authored content cannot live
# there. Its subpackages are enumerated rather than discovered because `SCRIPTS`
# and `scripts` in Kali share one directory here (Windows is case-insensitive),
# and a find() would take whichever it met first without saying so.
packages = [
  "eliza", "eliza.psyche",
  "shards", "shards.aoa", "shards.azazael_toolkit", "shards.cli",
  "shards.codex", "shards.core", "shards.daemons", "shards.eve_unleashed",
  "shards.hydra", "shards.interpreters", "shards.meta", "shards.ml",
  "shards.orchestration", "shards.root", "shards.scripts", "shards.tests",
  "shards.tools", "shards.utilities",
  "tools",
]
include-package-data = true

[tool.setuptools.package-data]
"eliza.psyche" = ["data/*.json", "data/*.jsonl", "py.typed"]
"shards" = ["SHARD_INDEX.json", "WIRED.json"]
"tools" = ["bcc_bypass.py", "ultra_loose.py", "WINDOWS_WSL_CONCURRENT.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The instruments are imported by the tests by module name (they sit beside the
# tests, not inside the package), so the tools directory is on the path.
pythonpath = [".", "tools"]
